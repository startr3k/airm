[project]
name = "mindforge-assess"
version = "0.1.0"
description = "MindForge AI Risk Materiality Assessment Tool"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindforge_assess"]
# The package is fully annotated, so say so: without this marker mypy refuses to look
# inside it from anywhere else, including the test suite.
artifacts = ["src/mindforge_assess/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# Tests are checked, but not made to annotate every pytest fixture argument: the value
# of strict mode is in the code that ships, and `tmp_path: Path, monkeypatch: MonkeyPatch`
# on fifty test functions is noise, not safety.
[[tool.mypy.overrides]]
module = ["tests.*", "conftest", "test_*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

